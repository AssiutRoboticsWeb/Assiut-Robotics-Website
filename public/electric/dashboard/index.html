<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dahboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>Dashboard</h1>
  <button class="home-btn" onclick="goToHome()">Main Page</button>

  <table id="taskTable">
    <thead>
      <tr>
        <th>Person</th>
        <th>Task</th>
        <th>State</th>
        <th>Date</th>
        <th>Rate</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- نافذة التصحيح -->
  <div id="correctionModal" class="modal">
    <div class="modal-content">
      <span class="closeBtn" onclick="closeModal()">&times;</span>
      <h2 id="taskTitle">Rate Task </h2>
      <p><strong>Answer Task:</strong></p>
      <p id="taskAnswer"></p>
      <label>Feedback & Comments</label>
      <textarea id="commentInput" rows="3" required></textarea>
      <label>Rate:</label>
      <input type="number" id="gradeInput" min="0" max="100" required />
      <button onclick="submitCorrection()" class="home-btn">Send Feedback</button>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
