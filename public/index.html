        </section>
        <nav class="slider-navigation">
            <button class="nav-button" aria-selected="true">
                <img class="thumbnail" src="all-images/RoboticsLap.jpg" alt="Thumbnail 1" />
            </button>
            <button class="nav-button" aria-selected="false">
                <img class="thumbnail" src="all-images/rov111111111.jpg" alt="Thumbnail 2" />
            </button>
            <button class="nav-button" aria-selected="false">

            </button>
            <button class="nav-button" aria-selected="false">
                <img class="thumbnail" src="all-images/2.jpeg" alt="Thumbnail 4" />
            </button>
            <button class="nav-button" aria-selected="false">
                <img class="thumbnail" src="all-images/Rov1.jpg" alt="Thumbnail 5" />
            </button>
            <button class="nav-button" aria-selected="false">
                <img class="thumbnail" src="all-images/mine2.jpg" alt="Thumbnail 6" />
            </button>

        <p class="subtitle">we have achieved a perfect place in these competition</p>
